version: "3.8"

services:
  rustfs:
    container_name: acs-rustfs-prod
    image: rustfs/rustfs:latest
    volumes:
      - rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    command: /data
    restart: unless-stopped
    ports:
      # - "9000:9000"
      - "9001:9001"
    networks:
      - acs-prod-network

volumes:
  rustfs-data:

networks:
  acs-prod-network:
    external: true
    name: acs-prod-network
