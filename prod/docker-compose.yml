services:
  rustfs:
    container_name: acs-rustfs-prod
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:47c1141822010b2f3d4cbcec1b1f3480b7a2d732696d6eec8bb2a34b04921df3
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_ACCESS_KEY:?RUSTFS_ADMIN_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_SECRET_KEY:?RUSTFS_ADMIN_SECRET_KEY must be set}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - rustfs-data:/data
    expose:
      - "9000"
    networks:
      - acs-prod-network
      - media-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=acs-prod-network
      - "traefik.http.routers.acs-media-prod.rule=Host(`acs.kmutt.ac.th`) && Method(`GET`,`HEAD`) && (PathPrefix(`/media/acs-media/public/profiles/`) || PathPrefix(`/media/acs-media/public/news/`) || PathPrefix(`/media/acs-media/public/projects/`) || PathPrefix(`/media/acs-media/public/curriculums/`) || PathPrefix(`/media/acs-media/public/class-books/`) || PathPrefix(`/media/acs-media/public/images/migrated/`))"
      - traefik.http.routers.acs-media-prod.entrypoints=web
      - traefik.http.routers.acs-media-prod.priority=100
      - traefik.http.routers.acs-media-prod.middlewares=acs-media-prod-prefix
      - traefik.http.middlewares.acs-media-prod-prefix.stripprefix.prefixes=/media
      - traefik.http.routers.acs-media-prod.service=acs-media-prod
      - traefik.http.services.acs-media-prod.loadbalancer.server.port=9000

  database:
    container_name: acs-website-database-prod
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./databasepg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acs-prod-network

  servers:
    container_name: acs-website-server-prod
    image: ghcr.io/asc-base/acs-core-service:1.3.1
    restart: unless-stopped
    volumes:
      - media-migration-state:/var/lib/acs-media-migration
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_PORT: ${APP_PORT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      PROFILE_MEDIA_PROVIDER: ${PROFILE_MEDIA_PROVIDER:-supabase}
      NEWS_MEDIA_PROVIDER: ${NEWS_MEDIA_PROVIDER:-rustfs}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-rustfs}
      MEDIA_SOURCE_ALLOWED_ORIGINS: ${MEDIA_SOURCE_ALLOWED_ORIGINS:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_APP_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_APP_SECRET_ACCESS_KEY:-}
      RUSTFS_PUBLIC_BASE_URL: https://acs.kmutt.ac.th/media/acs-media
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TIMEZONE: ${TIMEZONE}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      HTTPONLY: ${HTTPONLY}
      SECURE: ${SECURE}
      ENVIRONMENT: PRODUCTION
      APP_HOST: ${APP_HOST}
      SECRET_JWT: ${SECRET_JWT}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      SKIP_MIGRATE: ${SKIP_MIGRATE}
      RUN_SEED: ${RUN_SEED}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
    depends_on:
      database:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${APP_PORT}/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - acs-prod-network
      # - gateway-nginx

  portal:
    container_name: acs-website-portal-prod
    image: ghcr.io/asc-base/acs-portal:v3.6.0
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT}:${PORTAL_PORT}"
    environment:
      API_URL: ${API_URL}
      NODE_ENV: PRODUCTION
      PORT: ${PORTAL_PORT}
    # depends_on:
    #   servers:
    #     condition: service_healthy
    networks:
      - acs-prod-network
    #   - gateway-nginx

networks:
  acs-prod-network:
    driver: bridge
  media-proxy:
    external: true
    name: acs-prod-network
  # gateway-nginx:
  #   external: true

volumes:
  rustfs-data:
    name: acs-profile-media-prod
  media-migration-state:
    name: acs-media-migration-state-prod
