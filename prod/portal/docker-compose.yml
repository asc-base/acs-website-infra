services:
  portal:
    container_name: acs-website-portal-prod
    # Set this to the sha256 digest from the staging portal image to promote it.
    image: ghcr.io/asc-base/acs-portal:v3.10.3
    restart: unless-stopped
    environment:
      # Use the core-service origin reachable over dokploy-network.
      API_URL: ${API_URL:?API_URL must be set}
      NODE_ENV: production
      PORT: "3000"
      RUSTFS_READ_ENDPOINT: ${RUSTFS_READ_ENDPOINT:-http://acs-rustfs-prod:9000}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
    # depends_on:
    #   servers:
    #     condition: service_healthy
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network
