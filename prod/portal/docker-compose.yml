services:
  portal:
    container_name: acs-website-portal-prod
    # Set this to the sha256 digest from the staging portal image to promote it.
    image: ghcr.io/asc-base/acs-portal:v3.9.7
    restart: unless-stopped
    environment:
      # Use the core-service origin reachable over acs-prod-network.
      API_URL: ${API_URL:?API_URL must be set}
      NODE_ENV: production
      PORT: "3000"
      RUSTFS_READ_ENDPOINT: ${RUSTFS_READ_ENDPOINT:-http://acs-rustfs-prod:9000}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
    # depends_on:
    #   servers:
    #     condition: service_healthy
    networks:
      - acs-prod-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=acs-prod-network
      - traefik.http.routers.acs-portal.rule=Host(`acs.kmutt.ac.th`)
      - traefik.http.routers.acs-portal.entrypoints=web
      - traefik.http.routers.acs-portal.priority=1
      - traefik.http.routers.acs-portal.service=acs-portal
      - traefik.http.services.acs-portal.loadbalancer.server.port=3000

networks:
  acs-prod-network:
    external: true
    name: acs-prod-network
