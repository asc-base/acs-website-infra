services:
  rustfs:
    container_name: acs-rustfs-dev
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:47c1141822010b2f3d4cbcec1b1f3480b7a2d732696d6eec8bb2a34b04921df3
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ADMIN_ACCESS_KEY:?RUSTFS_ADMIN_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${RUSTFS_ADMIN_SECRET_KEY:?RUSTFS_ADMIN_SECRET_KEY must be set}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - rustfs-data:/data
    expose:
      - "9000"
    networks:
      - acs-dev-network

  database:
    container_name: acs-website-database-dev
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./databasepg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acs-dev-network

  servers:
    container_name: acs-website-server-dev
    image: ghcr.io/asc-base/acs-core-service:1.2.0
    restart: unless-stopped
    volumes:
      - media-migration-state:/var/lib/acs-media-migration
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_PORT: ${APP_PORT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      PROFILE_MEDIA_PROVIDER: ${PROFILE_MEDIA_PROVIDER:-supabase}
      NEWS_MEDIA_PROVIDER: ${NEWS_MEDIA_PROVIDER:-rustfs}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-rustfs}
      MEDIA_SOURCE_ALLOWED_ORIGINS: ${MEDIA_SOURCE_ALLOWED_ORIGINS:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_APP_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_APP_SECRET_ACCESS_KEY:-}
      RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL:-http://localhost:3000/media/acs-media}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TIMEZONE: ${TIMEZONE}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      HTTPONLY: ${HTTPONLY}
      SECURE: ${SECURE}
      ENVIRONMENT: development
      APP_HOST: ${APP_HOST}
      SECRET_JWT: ${SECRET_JWT}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
    depends_on:
      database:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f https://localhost:${APP_PORT}/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - acs-dev-network
      - gateway-nginx

  portal:
    container_name: acs-website-portal-dev
    image: ghcr.io/asc-base/acs-portal:v3.3.0
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT}:${PORTAL_PORT}"
    environment:
      API_URL: ${API_URL}
      NODE_ENV: development
      PORT: ${PORTAL_PORT}
      RUSTFS_READ_ENDPOINT: ${RUSTFS_READ_ENDPOINT:-http://rustfs:9000}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
    # depends_on:
    #   servers:
    #     condition: service_healthy
    networks:
      - acs-dev-network
      - gateway-nginx

networks:
  acs-dev-network:
    driver: bridge
  gateway-nginx:
    external: true

volumes:
  rustfs-data:
    name: acs-profile-media-dev
  media-migration-state:
    name: acs-media-migration-state-dev
