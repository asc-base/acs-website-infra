services:

  servers:
    platform: linux/amd64
    container_name: acs-core-service-staging
    image: ghcr.io/asc-base/acs-core-service:v1.7.2-rc.7
    restart: unless-stopped
    volumes:
      - media-migration-state:/var/lib/acs-media-migration
    environment:
      APP_PORT: ${APP_PORT:?APP_PORT must be set}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      PROFILE_MEDIA_PROVIDER: ${PROFILE_MEDIA_PROVIDER:-supabase}
      NEWS_MEDIA_PROVIDER: ${NEWS_MEDIA_PROVIDER:-rustfs}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-rustfs}
      MEDIA_SOURCE_ALLOWED_ORIGINS: ${MEDIA_SOURCE_ALLOWED_ORIGINS:-}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      HTTPONLY: ${HTTPONLY}
      SECURE: ${SECURE}
      ENVIRONMENT: prod
      APP_HOST: ${APP_HOST}
      SECRET_JWT: ${SECRET_JWT}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      SKIP_MIGRATE: ${SKIP_MIGRATE}
      RUN_SEED: ${RUN_SEED}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL:?FRONTEND_RESET_PASSWORD_URL must be set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:?MAIL_USER must be set}
      MAIL_PASS: ${MAIL_PASS:?MAIL_PASS must be set}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}

    expose:
      - "${APP_PORT:?APP_PORT must be set}"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.acs-core-staging-http.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.routers.acs-core-staging-http.entrypoints=web
      - traefik.http.routers.acs-core-staging-http.priority=100
      - traefik.http.routers.acs-core-staging-http.middlewares=acs-core-staging-https
      - traefik.http.routers.acs-core-staging-http.service=acs-core-staging
      - traefik.http.middlewares.acs-core-staging-https.redirectscheme.scheme=https
      - "traefik.http.routers.acs-core-staging-https.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.routers.acs-core-staging-https.entrypoints=websecure
      - traefik.http.routers.acs-core-staging-https.priority=100
      - traefik.http.routers.acs-core-staging-https.tls=true
      - traefik.http.routers.acs-core-staging-https.tls.certresolver=letsencrypt
      - traefik.http.routers.acs-core-staging-https.service=acs-core-staging
      - traefik.http.services.acs-core-staging.loadbalancer.server.port=${APP_PORT:?APP_PORT must be set}

networks:
  dokploy-network:
    external: true

volumes:
  media-migration-state:
    name: acs-media-migration-state-staging
