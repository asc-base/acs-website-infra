services:

  servers:
    platform: linux/amd64
    container_name: acs-core-service-staging
    image: ghcr.io/asc-base/acs-core-service:v1.6.0-rc.1
    restart: unless-stopped
    volumes:
      - media-migration-state:/var/lib/acs-media-migration
    environment:
      APP_PORT: ${APP_PORT:?APP_PORT must be set}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      PROFILE_MEDIA_PROVIDER: ${PROFILE_MEDIA_PROVIDER:-supabase}
      NEWS_MEDIA_PROVIDER: ${NEWS_MEDIA_PROVIDER:-rustfs}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-rustfs}
      MEDIA_SOURCE_ALLOWED_ORIGINS: ${MEDIA_SOURCE_ALLOWED_ORIGINS:-}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
      RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      HTTPONLY: ${HTTPONLY}
      SECURE: ${SECURE}
      ENVIRONMENT: prod
      APP_HOST: ${APP_HOST}
      SECRET_JWT: ${SECRET_JWT}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      SKIP_MIGRATE: ${SKIP_MIGRATE}
      RUN_SEED: ${RUN_SEED}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}

    expose:
      - "${APP_PORT:?APP_PORT must be set}"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.acs-core-staging-http.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.routers.acs-core-staging-http.entrypoints=web
      - traefik.http.routers.acs-core-staging-http.priority=100
      - traefik.http.routers.acs-core-staging-http.middlewares=acs-core-staging-https
      - traefik.http.routers.acs-core-staging-http.service=acs-core-staging
      - traefik.http.middlewares.acs-core-staging-https.redirectscheme.scheme=https
      - "traefik.http.routers.acs-core-staging-https.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Path(`/api`) || PathPrefix(`/api/`))"
      - traefik.http.routers.acs-core-staging-https.entrypoints=websecure
      - traefik.http.routers.acs-core-staging-https.priority=100
      - traefik.http.routers.acs-core-staging-https.tls=true
      - traefik.http.routers.acs-core-staging-https.tls.certresolver=letsencrypt
      - traefik.http.routers.acs-core-staging-https.service=acs-core-staging
      - traefik.http.services.acs-core-staging.loadbalancer.server.port=${APP_PORT:?APP_PORT must be set}

  media-proxy:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    environment:
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:?RUSTFS_ENDPOINT must be set}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-acs-media}
      NGINX_ENVSUBST_FILTER: "^RUSTFS_(ENDPOINT|BUCKET)$"
    configs:
      - source: staging-media-proxy
        target: /etc/nginx/templates/default.conf.template
    expose:
      - "8080"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.acs-media-staging-http.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Method(`GET`) || Method(`HEAD`)) && (PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/profiles/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/news/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/projects/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/curriculums/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/class-books/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/images/migrated/`))"
      - traefik.http.routers.acs-media-staging-http.entrypoints=web
      - traefik.http.routers.acs-media-staging-http.priority=100
      - traefik.http.routers.acs-media-staging-http.middlewares=acs-media-staging-https
      - traefik.http.routers.acs-media-staging-http.service=acs-media-staging
      - traefik.http.middlewares.acs-media-staging-https.redirectscheme.scheme=https
      - "traefik.http.routers.acs-media-staging-https.rule=Host(`${STAGING_HOST:?STAGING_HOST must be set}`) && (Method(`GET`) || Method(`HEAD`)) && (PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/profiles/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/news/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/projects/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/curriculums/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/class-books/`) || PathPrefix(`/media/${RUSTFS_BUCKET:-acs-media}/public/images/migrated/`))"
      - traefik.http.routers.acs-media-staging-https.entrypoints=websecure
      - traefik.http.routers.acs-media-staging-https.priority=100
      - traefik.http.routers.acs-media-staging-https.tls=true
      - traefik.http.routers.acs-media-staging-https.tls.certresolver=letsencrypt
      - traefik.http.routers.acs-media-staging-https.service=acs-media-staging
      - traefik.http.services.acs-media-staging.loadbalancer.server.port=8080

configs:
  staging-media-proxy:
    file: ./media-proxy.conf.template

networks:
  dokploy-network:
    external: true

volumes:
  media-migration-state:
    name: acs-media-migration-state-staging
