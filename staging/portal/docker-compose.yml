services:
  portal:
    container_name: acs-website-portal-staging
    image: ghcr.io/asc-base/acs-portal@sha256:d4ede4ee939a0331648abe5454a200844b0c8b3f9e73776030a6bd0ffbd5d5a8
    restart: unless-stopped
    environment:
      # Use the core-service origin reachable over dokploy-network.
      API_URL: ${API_URL:?API_URL must be set}
      NODE_ENV: staging
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
