services:
  portal:
    container_name: acs-website-portal-staging
    image: ghcr.io/asc-base/acs-portal@sha256:acc67add9d4674dbef62d991522b6a732603a5a2ceb1c61094c7223766829284
    restart: unless-stopped
    environment:
      # Use the core-service origin reachable over dokploy-network.
      API_URL: ${API_URL:?API_URL must be set}
      NODE_ENV: staging
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
