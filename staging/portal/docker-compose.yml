x-portl-image: &portl-image ghcr.io/asc-base/acs-portal:v3.10.0-rc.2
services:
  portal:
    container_name: acs-website-portal-staging
    image: *portl-image
    restart: unless-stopped
    environment:
      # Use the core-service origin reachable over dokploy-network.
      API_URL: ${API_URL:?API_URL must be set}
      NODE_ENV: staging
      PORT: "3000"
      RUSTFS_READ_ENDPOINT: ${RUSTFS_READ_ENDPOINT:?RUSTFS_READ_ENDPOINT must be set}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET must be set}
    expose:
      - "3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
